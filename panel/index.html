<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Panel de administración — Distrito Palmerola</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/png" href="../assets/img/brand/mark.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/panel.css" />
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
</defs></svg>

<div class="login-wrap">
  <form class="login-card" onsubmit="location.href='dashboard.html';return false;">
    <img class="login-logo" src="../assets/img/brand/logo.png" alt="Distrito Palmerola" />
    <h1>Panel de administración</h1>
    <p class="sub">Ingresa para gestionar el sitio de Distrito Palmerola.</p>
    <div class="field"><label>Correo</label><input type="email" value="admin@distritopalmerola.com" /></div>
    <div class="field"><label>Contraseña</label><input type="password" value="demo1234" /></div>
    <button class="btn btn-primary btn-block" type="submit">Ingresar <svg class="ico"><use href="#i-arrow"/></svg></button>
    <div class="login-hint">Demostración — pulsa <b>Ingresar</b> para ver el panel.</div>
    <div class="login-foot">DISTRITO PALMEROLA · por CIMA PROPERTIES</div>
  </form>
</div>
</body>
</html>
